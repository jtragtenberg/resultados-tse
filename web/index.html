<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração presidente</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<script src="config.js"></script>
<script src="comparar.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  /* Tokens da identidade (ver design.md): --tse-* = interface; --cand1/--cand2/--prog/--nada = codificação de dados */
  :root { --tse-amarelo:#EBB400; --tse-texto:#1A1B1F; --tse-texto-sec:#44474E; --tse-borda:#DEE2E6; --tse-acao:#005CBB; --tse-erro:#BA1A1A; --tse-sucesso:#3A833A;
          --bg:#E8E8E8; --fg:var(--tse-texto); --mut:var(--tse-texto-sec); --card:#fff; --line:var(--tse-borda);
          --cand1:#c8102e; --cand2:#1f5fbf; --nada:#cfcfcf; --prog:#0f7b6c; }
  /* tema escuro: automático pelo sistema, ou forçado pelo botão (data-theme no <html>) */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161616; --fg:#eee; --mut:#a0a0a0; --card:#222; --line:#383838; --tse-acao:#7db2f5; --cand1:#e0405a; --cand2:#5b97f0; --nada:#444; --prog:#3fc0aa; color-scheme:dark } }
  :root[data-theme="dark"] { --bg:#161616; --fg:#eee; --mut:#a0a0a0; --card:#222; --line:#383838; --tse-acao:#7db2f5; --cand1:#e0405a; --cand2:#5b97f0; --nada:#444; --prog:#3fc0aa; color-scheme:dark }
  :root[data-theme="light"] { color-scheme:light }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:400 14px/1.4 Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif; font-variant-numeric:tabular-nums }
  :focus-visible { outline:2px solid var(--tse-acao); outline-offset:2px }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important } }
  header { background:var(--tse-amarelo); color:var(--tse-texto); padding:12px 16px; margin-bottom:12px; display:flex; flex-wrap:wrap; gap:4px 24px; align-items:baseline; justify-content:space-between }
  h1 { font-size:18px; font-weight:700; margin:0 } #sub { font-weight:500; margin-left:8px } #meta { font-size:12px; color:var(--tse-texto) } header .dir { display:flex; gap:12px; align-items:center }
  #copiar { background:transparent; border:1px solid var(--tse-texto); color:var(--tse-texto); padding:2px 10px; font-size:12px }
  #tema { background:transparent; border:1px solid var(--tse-texto); color:var(--tse-texto); padding:2px 10px; font-size:12px }
  footer { padding:0 16px 24px; font-size:12px; color:var(--mut) } footer a { color:var(--tse-acao) }
  .big { font-size:26px; font-weight:700; line-height:1.15 }
  main { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; padding:0 16px 24px }
  @media (max-width:900px) { main { grid-template-columns:minmax(0,1fr) } }
  main > *, aside > * { min-width:0 }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px }
  .bar { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:8px }
  .seg { display:inline-flex; max-width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:6px } .seg button { white-space:nowrap }
  .seg button { border:0; border-radius:0; border-right:1px solid var(--line) } .seg button:last-child { border-right:0 }
  .seg button.on { background:var(--fg); color:var(--bg); font-weight:500 }
  button { font:inherit; padding:4px 10px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; cursor:pointer }
  #svgbox svg { width:100%; height:auto; max-height:76vh; display:block }
  path { stroke:var(--bg); stroke-width:.4; vector-effect:non-scaling-stroke } path.uf { cursor:pointer; stroke-width:1 }
  path.ext { stroke:var(--mut); stroke-dasharray:4 3; stroke-width:1.2; cursor:pointer } .extl { fill:var(--fg); font-size:11px; font-weight:500; pointer-events:none; paint-order:stroke; stroke:var(--card); stroke-width:3px }
  path.pin { stroke:var(--fg); stroke-width:2 }
  #svgbox svg { cursor:grab; touch-action:none } #svgbox svg:active { cursor:grabbing }
  #zoom { position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:4px; z-index:2 } #zoom button { width:30px; padding:4px 0; font-size:16px }
  .barra { display:flex; height:18px; border-radius:4px; overflow:hidden; background:var(--nada); margin:4px 0 }
  .barra div { height:100% }
  .prog { height:10px; border-radius:5px; background:var(--nada); overflow:hidden; margin:4px 0 } .prog div { height:100%; background:var(--prog) }
  .placar { display:flex; justify-content:space-between; font-weight:600 }
  .l { color:var(--cand1) } .f { color:var(--cand2) } .m { color:var(--mut); font-size:12px }
  table { width:100%; border-collapse:collapse; font-size:13px } td, th { padding:3px 4px; text-align:right; border-bottom:1px solid var(--line) }
  th { color:var(--mut); font-weight:500; user-select:none; cursor:pointer } td:first-child, th:first-child { text-align:left }
  tr.sel { background:rgba(128,128,128,.18) } tbody tr { cursor:pointer }
  #tip { position:fixed; pointer-events:none; background:var(--card); border:1px solid var(--line); padding:6px 8px; border-radius:6px; font-size:12px; display:none; z-index:9 }
  .leg { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--mut); margin-top:8px; flex-wrap:wrap }
  .leg i { display:inline-block; width:120px; height:10px; border-radius:2px }
  #linha { display:flex; align-items:center; gap:0; padding:0 16px 12px; overflow-x:auto }
  #linha button { position:relative; border:0; background:none; padding:18px 14px 4px; color:var(--mut); border-radius:0; white-space:nowrap; font-size:13px }
  #linha button::before { content:""; position:absolute; top:6px; left:50%; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:var(--mut); opacity:.55; border:2px solid var(--bg); box-shadow:0 0 0 1px var(--mut); z-index:1 }
  #linha button::after { content:""; position:absolute; top:10px; left:50%; width:100%; height:2px; background:var(--mut); opacity:.35 }
  #linha button:last-child::after { display:none }
  #linha button.on { color:var(--fg); font-weight:700 } #linha button.on::before { background:var(--fg); box-shadow:0 0 0 1px var(--fg); opacity:1 }
  #linha button.live::before { background:var(--tse-erro); opacity:1; box-shadow:0 0 0 1px var(--tse-erro) }
  #tempo { display:none; margin:0 16px 12px; padding:10px 12px; gap:12px; align-items:center; flex-wrap:wrap }
  #tempo.on { display:flex }
  #tempo button { min-width:34px } #tempo input[type=range] { flex:1 1 260px; min-width:160px; accent-color:var(--prog) }
  #tlock { display:inline-flex; gap:6px; align-items:center; cursor:pointer } #tlock input { accent-color:var(--tse-acao) }
  #tlabel { min-width:230px; font-size:13px } #tlabel b { font-size:15px }
  #tspark { width:100%; height:34px; display:block } #tspark path { stroke:none; vector-effect:none }
  [hidden] { display:none !important }
  #modos { display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap } #modos button { font-weight:500 } #modos button.on { background:var(--fg); color:var(--bg) }
  body.cmp #linha, body.cmp #tempo { display:none !important }
  #tardeCard a, #tnota a { color:var(--tse-acao) } #tardeCard p { margin:6px 0 } #tardeCard button { margin-top:4px }
  #tardeSvg { width:100%; height:auto; display:block; margin-top:6px } #tardeSvg text { fill:var(--mut); font-size:9px; font-family:inherit } #tardeSvg .b1 { fill:var(--mut); opacity:.55 } #tardeSvg .b2 { fill:#d9480f }
  .dtab { width:100%; border-collapse:collapse; font-size:12px } .dtab th { color:var(--mut); font-weight:500; cursor:default; font-size:11px } .dtab td, .dtab th { padding:2px 4px; border-bottom:1px solid var(--line) }
  .dtab tr.dest td { font-weight:700 } #tip .dtab { min-width:260px }
  #barbox svg { width:100%; height:auto; max-height:76vh; display:block; touch-action:auto }
  #barbox text { fill:var(--fg); font-family:inherit } #barbox .ax { fill:var(--mut); font-size:11px } #barbox .vl { font-size:9.5px; fill:var(--mut) }
  #barbox .xl { font-size:11px; font-weight:500 } #barbox .gr { stroke:var(--line); stroke-width:1 } #barbox rect { cursor:pointer }
  #barbox .gh { fill:none; stroke:var(--mut); stroke-width:1; stroke-dasharray:3 2 }
  #barbox .sel { stroke:var(--fg); stroke-width:2 }
  #loading { position:absolute; padding:8px; color:var(--mut) } #svgwrap { position:relative }
</style>
</head>
<body>
<header>
  <h1>Apuração presidente<span id="sub"><span id="n1">Lula</span> x <span id="n2">Flávio Bolsonaro</span></span></h1>
  <div class="dir"><div id="meta">carregando…</div><button id="copiar" title="copia o endereço desta visualização">🔗 Copiar link</button><button id="tema" aria-pressed="false" title="alternar tema claro/escuro"></button></div>
</header>
<nav id="modos" aria-label="Modo de visualização"></nav>
<nav id="linha" aria-label="Linha do tempo de eleições"></nav>
<section class="card" id="tempo" aria-label="Replay da apuração">
  <button id="tplay" title="tocar / pausar (espaço)">▶</button>
  <input type="range" id="tslider" min="0" max="1000" value="1000" step="1" aria-label="Porcentagem de urnas apuradas">
  <div id="tlabel"></div>
  <button id="tfinal" title="ir ao resultado final">Final</button>
  <label id="tlock" class="m" title="Ao trocar de eleição na linha do tempo (ou com ← →), o slider continua na mesma porcentagem de urnas apuradas"><input type="checkbox" id="tlockbox" checked> manter a % ao trocar de eleição</label>
  <div id="tnota" class="m" hidden style="flex-basis:100%"></div>
  <svg id="tspark" viewBox="0 0 600 34" preserveAspectRatio="none" aria-hidden="true"></svg>
</section>
<main>
  <section class="card">
    <div class="bar" id="cmpBar" hidden>
      <span class="seg" id="segCVista"></span><span class="seg" id="segCEsc"></span><span class="seg" id="segCMet"></span><span class="seg" id="segCUnid"></span><span class="seg" id="segCN"></span>
    </div>
    <div class="bar" id="mainBar">
      <span class="seg" id="segVista"></span>
      <span class="seg" id="segNivel"></span>
      <span class="seg" id="segMetrica"></span>
      <button id="voltar" hidden>← Brasil</button>
      <strong id="titulo"></strong>
    </div>
    <div class="bar" id="barOpc" hidden>
      <span class="seg" id="segBEsc"></span><span class="seg" id="segBN"></span><span class="seg" id="segBCand"></span><span class="seg" id="segBVal"></span><span class="seg" id="segBUnid"></span>
    </div>
    <div id="svgwrap"><div id="zoom"><button id="zin" title="aproximar">+</button><button id="zout" title="afastar">−</button><button id="zreset" title="ver tudo" style="font-size:12px">⌂</button></div><div id="loading" hidden>carregando malha do IBGE…</div><div id="svgbox"></div></div>
    <div id="barbox" hidden></div>
    <div class="leg" id="leg"></div>
  </section>
  <aside style="display:flex;flex-direction:column;gap:16px">
    <section class="card" id="cmpResumo" hidden></section>
    <section class="card" id="detalhe"></section>
    <section class="card" id="tardeCard" hidden><div style="font-size:15px;font-weight:700" id="tardeTit"></div><div class="m" id="tardeSub"></div><svg id="tardeSvg" viewBox="0 0 400 150" role="img" aria-label="Votos por minuto em torno do encerramento"></svg><div class="m" id="tardeTxt"></div></section>
    <section class="card"><div class="seg" id="segTab" style="margin-bottom:8px"></div><div class="seg" id="segCTab" style="margin-bottom:8px" hidden></div><table id="tab"><thead></thead><tbody></tbody></table></section>
  </aside>
</main>
<footer>Fonte: TSE — Divulgação de resultados (<a href="https://resultados.tse.jus.br/" rel="noopener">resultados.tse.jus.br</a>) e Portal de Dados Abertos · <span id="fonte">–</span><br>Projeto independente, sem vínculo com a Justiça Eleitoral.</footer>
<div id="tip"></div>
<script>
const COD = {ac:12,al:27,am:13,ap:16,ba:29,ce:23,df:53,es:32,go:52,ma:21,mg:31,ms:50,mt:51,pa:15,pb:25,pe:26,pi:22,pr:41,rj:33,rn:24,rs:43,ro:11,rr:14,sc:42,se:28,sp:35,to:17};
const UF_DE_COD = Object.fromEntries(Object.entries(COD).map(([k,v]) => [v,k]));
const IBGE = "https://servicodados.ibge.gov.br/api/v3/malhas";
const fmt = new Intl.NumberFormat("pt-BR"), pc = x => (x*100).toFixed(1).replace(".",",")+"%";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
/* tema: preferência salva (se o navegador permitir); sem preferência, segue o sistema */
const escuroAgora = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function rotuloTema() { const b = document.getElementById("tema"), e = escuroAgora(); b.textContent = e ? "☀ Tema claro" : "☾ Tema escuro"; b.setAttribute("aria-pressed", e); }
try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch {}
const st = { modo:"apuracao", cMet:"margem", cUnid:"abs", cEsc:"uf", cN:25, cTab:"uf", bEsc:"uf", bN:25, bCand:"ambos", bVal:"abs", bUnid:"pct", vista:"mapa", nivel:"estados", metrica:"voto", uf:null, pin:null, ord:"uf", asc:true, tab:"votos", zk:null };
const METRICAS = { abst:["Abstenção","#b8860b"], brancos:["Brancos","#6d4fc2"], nulos:["Nulos","#d0489a"], tarde:["Votos após as 17h","#d9480f"], comp:["Comparecimento","#2a7f9e"] };   // nivel: estados | municipios | uf
let dados = null; const geos = {};
{ const t = new URLSearchParams(location.hash.slice(1)).get('tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; }   // #tema=dark força o tema
/* O endereço (#...) guarda a visualização: eleição, modo, abas, escala, região selecionada e % da apuração. Copie o link para compartilhar. */
const CHAVES_URL = { metrica:"metrica", nivel:"nivel", uf:"uf", tab:"tab", ord:"ord", eleicao:"eleicao", pct:"pct", vista:"vista", bcand:"bCand", bval:"bVal", bunid:"bUnid", besc:"bEsc", bn:"bN",
  modo:"modo", cmet:"cMet", cunid:"cUnid", cesc:"cEsc", cn:"cN", ctab:"cTab", frame:"frame0" };
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => {
  if (k === "sel") st.pin = { k:v, nome:"" };
  else if (CHAVES_URL[k]) st[CHAVES_URL[k]] = (k === "pct" || k === "bn" || k === "cn") ? +v : v;   // pct = fração de urnas apuradas
});

const N1 = () => (dados?.cands?.v1 ?? "Lula").split(" ")[0], N2 = () => (dados?.cands?.v2 ?? "Flávio").split(" ").slice(-1)[0];
const pctApur = r => r && r.ts ? r.st/r.ts : 0;
const pComp = r => r && r.comp + r.abst ? r.comp / (r.comp + r.abst) : 0;
const pAbst = r => r && r.comp + r.abst ? r.abst/(r.comp + r.abst) : 0;
const pBrancos = r => r && r.total ? r.brancos/r.total : 0;
const pNulos = r => r && r.total ? r.nulos/r.total : 0;
const valorMetrica = { abst:pAbst, brancos:pBrancos, nulos:pNulos, tarde:r => r?.tv?.votos ? r.tv.tarde / r.tv.votos : 0, comp:r => r && r.comp + r.abst ? r.comp / (r.comp + r.abst) : 0 };
let escala = {};   // domínio máximo por métrica: percentil 95 dos municípios, para a cor não ficar toda no mesmo tom
function calcEscala() {
  for (const k in valorMetrica) {
    const v = Object.values(dados.mun).filter(r => r.st).map(valorMetrica[k]).sort((a,b) => a-b);
    escala[k] = v.length ? Math.max(v[Math.floor(v.length*0.95)], 0.01) : 0.1;
  }
}
const partes = r => { const t = r.v1 + r.v2; return t ? [r.v1/t, r.v2/t] : [0,0] };
function cor(r) {
  if (!r || (!r.st && st.metrica !== "tarde") || (st.metrica === "tarde" && !r.tv)) return css("--nada");
  if (st.metrica === "apuracao") return d3.interpolateRgb("#e4efec", css("--prog"))(pctApur(r));
  if (METRICAS[st.metrica]) return d3.interpolateRgb("#eeeeee", METRICAS[st.metrica][1])(Math.min(1, valorMetrica[st.metrica](r) / escala[st.metrica]));
  const [l,f] = partes(r), m = Math.max(-1, Math.min(1, (l-f)*2.5));
  return d3.interpolateRgb(css("--cand1"), css("--cand2"))((1 - m) / 2);   // vermelho (cand1) → roxo (equilíbrio) → azul (cand2); satura com 40 pp de vantagem
}
const opac = r => st.metrica === "voto" && r && r.st ? 0.35 + 0.65*pctApur(r) : 1;

const tipEl = document.getElementById("tip");
function tip(ev, html) { tipEl.style.display = html ? "block" : "none"; if (!html) return;
  tipEl.innerHTML = html; tipEl.style.left = Math.min(ev.clientX+12, innerWidth-230)+"px"; tipEl.style.top = (ev.clientY+12)+"px"; }
/* No celular não existe "mouseleave": o card do tooltip ficaria preso. Tocar fora de uma região (mapa ou barra) o esconde,
   e tocar num espaço vazio do mapa também solta a seleção. */
const REGIAO = "#svgbox path, #barbox .b";
document.addEventListener("pointerdown", ev => { if (!ev.target.closest(REGIAO)) tip(null, null); }, true);
addEventListener("scroll", () => tip(null, null), { passive:true });
document.addEventListener("click", ev => {
  if (!st.pin || ev.target.closest(`${REGIAO}, #detalhe, #tab, #tempo, #linha, header, footer, button, input, label, a, .seg`)) return;
  st.pin = null; render();   // espaço vazio (fundo do mapa, margens, fora dos cards)
});
function blocoVotos(r, grande) {
  if (!r) return "<span class='m'>sem dados</span>";
  const [l,f] = partes(r);
  return `${grande ? `<div class="m">Urnas apuradas</div><div class="big">${pc(pctApur(r))}</div><div class="m">${fmt.format(r.st)} de ${fmt.format(r.ts)} seções</div>` : `<div class="m">Urnas apuradas: <b>${pc(pctApur(r))}</b> (${fmt.format(r.st)} de ${fmt.format(r.ts)})</div>`}
    <div class="prog"><div style="width:${pctApur(r)*100}%"></div></div>
    <div class="placar"><span class="l">${N1()} ${r.st ? pc(l) : "–"}</span><span class="f">${r.st ? pc(f) : "–"} ${N2()}</span></div>
    <div class="barra"><div style="width:${l*100}%;background:var(--cand1)"></div><div style="width:${f*100}%;background:var(--cand2)"></div></div>
    <div class="m">${fmt.format(r.v1)} × ${fmt.format(r.v2)} votos válidos (sobre ${N1()} + ${N2()})</div>
    <div class="m" style="margin-top:4px">Votaram <b>${fmt.format(r.comp)}</b> de ${fmt.format(r.comp + r.abst)} eleitores${r.st ? ` (<b>${pc(pComp(r))}</b>)` : ""} · Abstenção <b>${r.st ? pc(pAbst(r)) : "–"}</b> (${fmt.format(r.abst)}) · Brancos <b>${r.st ? pc(pBrancos(r)) : "–"}</b> (${fmt.format(r.brancos)}) · Nulos <b>${r.st ? pc(pNulos(r)) : "–"}</b> (${fmt.format(r.nulos)})</div>
    ${r.tv ? `<div class="m" style="margin-top:4px">Depois das 17h: <b>${fmt.format(r.tv.tarde)}</b> votos (${pc(r.tv.votos ? r.tv.tarde / r.tv.votos : 0)} dos votos do local), em ${fmt.format(r.tv.ut)} de ${fmt.format(r.tv.urnas)} urnas${r.tv.ult ? ` · último voto +${Math.round(r.tv.ult)} min` : ""}</div>` : ""}`;
}
const tipHtml = (nome, r) => `<b>${nome}</b><br>${blocoVotos(r)}`;

// a malha do IBGE vem com anéis no sentido oposto ao que o d3 espera (senão o polígono vira "o globo inteiro")
function rebobinar(fc) {
  const inv = rs => rs.map(r => r.slice().reverse());
  fc.features.forEach(f => { const g = f.geometry;
    g.coordinates = g.type === "Polygon" ? inv(g.coordinates) : g.coordinates.map(inv); });
  return fc;
}
async function geo(url) { if (!geos[url]) { loading.hidden = false; try { geos[url] = rebobinar(await (await fetch(url)).json()); } finally { loading.hidden = true; } } return geos[url]; }

// Ilha fictícia "Exterior" no Atlântico, a leste do Nordeste: representa todos os votos de brasileiros no exterior
const ILHA = { cx:-27.5, cy:-9 };
function ilhaExterior() {
  const anel = [];
  for (let i = 0; i < 18; i++) { const a = (i / 18) * 2 * Math.PI, r = 2.3 + 0.4 * Math.sin(3 * a + 1) + 0.25 * Math.cos(5 * a);
    anel.push([ILHA.cx + 1.25 * r * Math.cos(a), ILHA.cy + r * Math.sin(a)]); }
  anel.push(anel[0]);
  const f = { type:"Feature", properties:{ ext:true, codarea:"zz" }, geometry:{ type:"Polygon", coordinates:[anel] } };
  if (d3.geoArea(f) > 2 * Math.PI) anel.reverse();   // o d3 espera o sentido contrário ao do GeoJSON padrão
  return f;
}
async function desenhar() {
